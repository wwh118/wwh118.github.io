<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회사원 고단백 씨의 하루</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="site"><section class="intro" aria-label="고단백 씨 소개"><img class="intro-background" src="assets/1-1(1).png" alt="" aria-hidden="true"><img class="intro-profile" src="assets/1-1 고단백 프로필.svg" alt="회사원 고단백 씨의 하루"></section>
<section class="scroll-story" id="daily"><div class="sticky-screen"><header class="timeline" id="timeline"><img class="timeline-bg" src="assets/헤더 사각형.svg" alt=""><nav class="timeline-buttons" aria-label="시간대별 장면 이동"><button class="time-button" data-scene="0" type="button">AM 7:30</button>
<button class="time-button" data-scene="1" type="button">AM 7:50</button>
<button class="time-button" data-scene="2" type="button">AM 8:10</button>
<button class="time-button" data-scene="3" type="button">PM 12:30</button>
<button class="time-button" data-scene="4" type="button">PM 3:40</button>
<button class="time-button" data-scene="5" type="button">PM 6:30</button>
<button class="time-button" data-scene="6" type="button">PM 9:00</button>
<button class="time-button" data-scene="7" type="button">PM 11:30</button></nav></header><div class="scene-stage"><div class="scene-layer scene-layer--0" data-index="0"><img src="assets/1-2.svg" alt="AM 7:30 고단백 씨의 하루"></div>
<div class="scene-layer scene-layer--1" data-index="1"><img src="assets/1-3.svg" alt="AM 7:50 고단백 씨의 하루"></div>
<div class="scene-layer scene-layer--2" data-index="2"><img src="assets/1-4.svg" alt="AM 8:10 고단백 씨의 하루"></div>
<div class="scene-layer scene-layer--3" data-index="3"><img src="assets/1-5.svg" alt="PM 12:30 고단백 씨의 하루"></div>
<div class="scene-layer scene-layer--4" data-index="4"><img src="assets/1-6.svg" alt="PM 3:40 고단백 씨의 하루"></div>
<div class="scene-layer scene-layer--5" data-index="5"><img src="assets/1-7.svg" alt="PM 6:30 고단백 씨의 하루"></div>
<div class="scene-layer scene-layer--6" data-index="6"><img src="assets/1-8.svg" alt="PM 9:00 고단백 씨의 하루"></div>
<div class="scene-layer scene-layer--7" data-index="7"><img src="assets/1-9.svg" alt="PM 11:30 고단백 씨의 하루"></div></div></div></section>
<section class="ending" id="ending" aria-label="고단백 씨의 마지막 질문과 계란 장면">
  <div class="ending-stage">
    <div class="ending-strip">
      <div class="ending-panel ending-panel--first">
        <img class="ending-background" src="assets/1-10.png" alt="" />
        <div class="bubble bubble--1"><img src="assets/그런데 혹시.svg" alt="그런데 혹시" /></div>
        <div class="bubble bubble--2"><img src="assets/내가 매일 먹고 있는 음식에서.svg" alt="내가 매일 먹고 있는 음식에서" /></div>
        <div class="bubble bubble--3"><img src="assets/무언가 빠져 있는 건 아닐까.svg" alt="무언가 빠져 있는 건 아닐까?" /></div>
      </div>
      <div class="ending-panel ending-panel--second">
        <img class="ending-background" src="assets/2-1-1.png" alt="" />
      </div>
      <img class="eggs-continuous" src="assets/계란 전체.svg" alt="화면을 가득 채우는 계란 일러스트" />
    </div>
  </div>
</section>
</main><script src="js/script.js"></script></body></html>
